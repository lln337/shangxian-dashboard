<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta http-equiv="Pragma" content="no-cache">
    <meta http-equiv="Expires" content="0">
    <title>现场信息看板</title>
    <script src="js/chart.umd.min.js"></script>
    <link rel="stylesheet" href="css/common.css">
</head>
<body>
    <div class="header">
        <h1>现场信息看板</h1>
    </div>

    <!-- 顶层 Tab 导航 -->
    <div class="main-tab-nav">
        <button class="main-tab-btn active" data-tab="flow" onclick="switchMainTab('flow')">上线流量</button>
        <button class="main-tab-btn" data-tab="part" onclick="switchMainTab('part')">排序零件GKB查询</button>
        <button class="main-tab-btn" data-tab="daokou" onclick="switchMainTab('daokou')">道口卸货及时率</button>
    </div>

    <!-- ========== Tab1：上线流量 ========== -->
        <div id="main-tab-flow" class="main-tab-content active">
            <!-- 数据日期信息（由生成脚本注入） -->
            <div id="flow-date-info" style="padding:8px 0;font-size:13px;color:#666;"></div>
            <div id="flow-update-time" style="font-size:12px;color:#999;margin-bottom:8px;"></div>

        <!-- 流量子 Tab -->
        <div class="flow-subtab-nav">
            <button class="flow-subtab-btn active" data-subtab="big" onclick="switchFlowSubTab('big')">大件线路</button>
            <button class="flow-subtab-btn" data-subtab="small" onclick="switchFlowSubTab('small')">小件线路</button>
        </div>

        <!-- 统计卡片（由JS渲染） -->
        <div class="stats-row" id="flow-stats" style="display:none;">
            <div class="stat-card stat-total">
                <div class="stat-value" id="flow-total">--</div>
                <div class="stat-label">线路班次总数</div>
            </div>
            <div class="stat-card stat-high">
                <div class="stat-value" id="flow-high">--</div>
                <div class="stat-label">高饱和 (&gt;85%)</div>
            </div>
            <div class="stat-card stat-severe">
                <div class="stat-value" id="flow-severe">--</div>
                <div class="stat-label">严重饱和 (&gt;95%)</div>
            </div>
        </div>
        <div class="empty-state" id="flow-empty">暂无上线流量数据</div>

        <!-- 图表区域（由JS动态渲染 canvas） -->
        <div id="flow-charts-big" class="flow-subtab active"></div>
        <div id="flow-charts-small" class="flow-subtab"></div>

        <!-- 数据表格（由JS动态渲染） -->
        <div id="flow-table-big" class="sheet-section" style="display:none;"></div>
        <div id="flow-table-small" class="sheet-section" style="display:none;"></div>
    </div>

    <!-- ========== Tab2：排序零件GKB查询 ========== -->
    <div id="main-tab-part" class="main-tab-content">
        <div id="part-update-time" style="font-size:12px;color:#999;margin-bottom:8px;"></div>
        <div class="search-bar">
            <div class="search-input-wrapper">
                <input type="text" id="part-search-input" placeholder="输入零件编码 / 名称 / GKB 进行搜索...">
                <span class="search-icon">&#128269;</span>
            </div>
            <div class="search-stats">
                共 <strong id="part-total-count">0</strong> 条，
                显示 <strong id="part-visible-count">0</strong> 条
            </div>
        </div>
        <div class="part-table-container" id="part-container">
            <div class="part-table-header">
                <h2>排序零件 GKB 查询结果</h2>
                <span class="data-badge" id="part-source-badge"></span>
            </div>
            <div class="part-table-wrapper">
                <table class="part-table">
                    <thead>
                        <tr>
                            <th style="width:50px;">#</th>
                            <th style="width:140px;">零件编码</th>
                            <th>零件名称</th>
                            <th style="width:100px;">GKB</th>
                        </tr>
                    </thead>
                    <tbody id="part-tbody"></tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- ========== Tab3：道口卸货及时率 ========== -->
    <div id="main-tab-daokou" class="main-tab-content">
        <div id="daokou-update-time" style="font-size:12px;color:#999;margin-bottom:8px;"></div>
        <!-- KPI 卡片 -->
        <div class="stats-row" id="daokou-kpi" style="display:none;">
            <div class="stat-card stat-info">
                <div class="stat-value" id="dk-pass-rate">--</div>
                <div class="stat-label">当月合格率</div>
            </div>
            <div class="stat-card stat-total">
                <div class="stat-value" id="dk-total">--</div>
                <div class="stat-label">当月总车次</div>
            </div>
            <div class="stat-card stat-severe">
                <div class="stat-value" id="dk-timeout">--</div>
                <div class="stat-label">当月超时车次</div>
            </div>
            <div class="stat-card" style="border-color:#34a853;">
                <div class="stat-value" id="dk-delta" style="color:#34a853;">--</div>
                <div class="stat-label">较上月变化</div>
            </div>
        </div>
        <div class="empty-state" id="daokou-empty">暂无道口卸货及时率数据<br>请先在工具中执行"提取道口数据"</div>

        <!-- 图表区域 -->
        <div class="chart-grid" id="daokou-charts" style="display:none;">
            <div class="chart-box">
                <h3>月度合格率趋势</h3>
                <div class="chart-container" style="height:300px;"><canvas id="chart-dk-monthly"></canvas></div>
            </div>
            <div class="chart-box">
                <h3>周度合格率趋势</h3>
                <div class="chart-container" style="height:300px;"><canvas id="chart-dk-weekly"></canvas></div>
            </div>
            <div class="chart-box full">
                <h3>天级合格率（最近30天）</h3>
                <div class="chart-container" style="height:300px;"><canvas id="chart-dk-daily"></canvas></div>
            </div>
            <div class="chart-box">
                <h3>道口合格率排名（当月）</h3>
                <table class="rank-table" id="dk-berth-table">
                    <thead><tr><th>排名</th><th>道口</th><th>合格率</th><th>总车次</th></tr></thead>
                    <tbody></tbody>
                </table>
            </div>
            <div class="chart-box">
                <h3>班次合格率对比（当月）</h3>
                <div class="chart-container" style="height:300px;"><canvas id="chart-dk-shift"></canvas></div>
            </div>
        </div>
    </div>

    <div class="footer">
        <div>现场信息看板 | 上线流量 + 排序零件GKB查询 + 道口卸货及时率</div>
    </div>
